[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "omnihub"
version = "3.0.0"
description = "Ultra-Modern Precision AI Gateway, 1-Click OmniRoute Installer & System Studio for Linux, Windows and macOS"
readme = "README.md"
authors = [
    { name = "Md Sojib Hossain", email = "sojib@matraki.org" }
]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "PyQt5>=5.15.0",
    "requests>=2.28.0",
    "psutil>=5.9.0"
]

[project.urls]
Homepage = "https://github.com/sojibcreates-maker/OmniHub"
Donation = "https://ko-fi.com/sojibhossain"

[project.scripts]
omnihub = "omnihub.app:run"
